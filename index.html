<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khon Kaen Smart Guide - Dark Mode</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Prompt', sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #22b800; 
            margin: 0;
            color: #e0e0e0; 
            transition: background-color 0.3s;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #22b800; 
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            transition: background-color 0.3s;
        }

        /* ----------------------------------- */
        /* 1. อนิเมชันเรดาร์ (Radar Pulse)     */
        /* ----------------------------------- */
        .radar-container {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            width: 100%;
            height: 280px; /* จองพื้นที่ให้พอดีกับโลโก้ */
        }
        
        .logo {
            position: relative;
            z-index: 2; /* ให้อยู่ด้านหน้าคลื่น */
            width: 100%;
            max-width: 280px;
            height: auto;
        }

        .radar-pulse {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 1;
            /* ปิดการแสดงผลไว้ก่อน จะเริ่มทำงานเมื่อกดปุ่ม */
            display: none; 
        }

        /* เมื่อใส่คลาส .active ให้คลื่นเริ่มทำงาน */
        .radar-container.active .radar-pulse {
            display: block;
            animation: pulse 2s infinite ease-out;
        }

        /* คลื่นลูกที่สองให้ทำงานช้ากว่าลูกแรก 1 วินาที */
        .radar-container.active .radar-pulse:nth-child(2) {
            animation-delay: 1s;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* ----------------------------------- */
        /* 2. อนิเมชันกระพริบตอนเจอพิกัด       */
        /* ----------------------------------- */
        @keyframes flash-success {
            0% { background-color: #22b800; }
            25% { background-color: #ffffff; } /* กระพริบขาว */
            50% { background-color: #22b800; }
            75% { background-color: #ffffff; } /* กระพริบขาว */
            100% { background-color: #22b800; }
        }

        /* ใช้คลาสนี้สวมเข้าไปที่ body และ .container ชั่วคราว */
        body.found-location, 
        .container.found-location {
            animation: flash-success 1.5s ease-in-out;
        }

        /* สไตล์เดิมที่เหลือของคุณ... */
        h1 { font-size: 28px; font-weight: 600; margin-top: 0; margin-bottom: 15px; color: #ffffff; }
        p { font-size: 20px; line-height: 1.5; color: #ffffff; margin-bottom: 20px; }
        .warning-box { background: rgba(255, 193, 7, 0.15); border: 1px solid #ffc107; color: #ffd54f; padding: 15px; border-radius: 12px; font-size: 16px; margin-bottom: 30px; text-align: left; line-height: 1.4; }
        #startBtn { width: 100%; padding: 20px; font-size: 24px; font-family: 'Prompt', sans-serif; font-weight: 600; background: #ff7043; color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 15px rgba(255, 112, 67, 0.25); transition: transform 0.2s, background 0.2s; }
        #startBtn:active { transform: scale(0.98); background: #f4511e; }
        #status { margin-top: 30px; font-size: 20px; color: #cccccc; padding: 20px; background: #2c2c2c; border: 1px solid #444; border-radius: 12px; min-height: 80px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        
        <div class="radar-container" id="radarWrap">
            <div class="radar-pulse"></div>
            <div class="radar-pulse"></div>
            <img src="bussing.png" alt="Bussing Transit Logo" class="logo">
        </div>
        
        <h1>เว่าให้ฟังแหน่</h1>
        <p>ระบบจะพูดบรรยายข้อมูลนิทรรศการอัตโนมัติ<br>เมื่อผู้ใช้เข้าใกล้ในระยะ 50 เมตร</p>

        <div class="warning-box">
            ⚠️ <b>คำแนะนำ:</b> กรุณาเปิดหน้าจอนี้ทิ้งไว้และไม่สลับแอปพลิเคชัน เพื่อให้ระบบ GPS ติดตามตำแหน่งและอ่านออกเสียงได้อย่างต่อเนื่อง
        </div>
        
        <button id="startBtn">📍 เริ่มต้นติดตามตำแหน่ง</button>
        
        <div id="status">รอการเริ่มต้น...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
