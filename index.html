<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khon Kaen Smart Guide - Dark Mode</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Prompt', sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #121212; /* เปลี่ยนพื้นหลังเป็นสีดำเข้ม */
            margin: 0;
            color: #e0e0e0; /* เปลี่ยนสีข้อความทั่วไปเป็นสีเทาสว่าง */
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e; /* พื้นหลังกล่องข้อความเป็นสีเทาเข้ม */
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); /* เพิ่มเงาให้ดูมีมิติบนพื้นดำ */
        }
        .logo {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
            color: #ffffff; /* สีหัวข้อเป็นสีขาวสนิท */
        }
        p {
            font-size: 20px;
            line-height: 1.5;
            color: #b0b0b0; /* สีข้อความรองเป็นสีเทา */
            margin-bottom: 40px;
        }
        #startBtn { 
            width: 100%;
            padding: 20px; 
            font-size: 24px; 
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            background: #ff7043; /* ปรับสีส้มให้สว่างขึ้นสำหรับ Dark Mode */
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 6px 15px rgba(255, 112, 67, 0.25);
            transition: transform 0.2s, background 0.2s;
        }
        #startBtn:active {
            transform: scale(0.98);
            background: #f4511e;
        }
        #status { 
            margin-top: 30px; 
            font-size: 20px; 
            color: #cccccc; 
            padding: 20px;
            background: #2c2c2c; /* พื้นหลังกล่องสถานะ */
            border: 1px solid #444; /* เพิ่มเส้นขอบบางๆ ให้กล่องสถานะ */
            border-radius: 12px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="bussing.png" alt="Bussing Transit Logo" class="logo">
        
        <h1>พิกัดที่เที่ยวขอนแก่น</h1>
        <p>ระบบจะอ่านข้อมูลสถานที่อัตโนมัติ<br>เมื่อเข้าใกล้ในระยะ 500 เมตร</p>
        
        <button id="startBtn">📍 เริ่มต้นติดตามตำแหน่ง</button>
        
        <div id="status">รอการเริ่มต้น...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
